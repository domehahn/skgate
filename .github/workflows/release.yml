name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Cross-Platform Binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/skgate-linux-amd64 ./cmd/skgate
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/skgate-darwin-arm64 ./cmd/skgate
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/skgate-windows-amd64.exe ./cmd/skgate

      - name: Generate SBOM and DSSE Provenance
        run: |
          python3 scripts/generate_sbom.py --artifact dist/skgate-linux-amd64 --name skgate --version ${GITHUB_REF_NAME#v} --output dist/skgate-linux-amd64.spdx.json
          python3 scripts/release_provenance.py --artifact dist/skgate-linux-amd64 --name skgate --version ${GITHUB_REF_NAME#v} --output dist/skgate-linux-amd64.provenance.json
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
